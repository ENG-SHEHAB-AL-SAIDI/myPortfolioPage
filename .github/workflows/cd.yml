
name: CD

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout released version
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Deploy to HelioHost
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.HELIOHOST_HOST }}
          username: ${{ secrets.HELIOHOST_USERNAME }}
          password: ${{ secrets.HELIOHOST_PASSWORD }}
          port: ${{ secrets.HELIOHOST_PORT }}
          sftp_only: true
          local_path: './dist/*'
          remote_path: ${{ secrets.HELIOHOST_REMOTE_PATH }}
          delete_remote_files: false
